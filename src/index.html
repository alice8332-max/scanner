<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的扫描</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: black;
            color: white;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        #captures::-webkit-scrollbar {
            width: 0;
            height: 0;
        }
        .account-menu {
            display: none;
            position: fixed;
            top: calc(3vh + 2vh);
            right: 2vh;
            z-index: 12;
            background: #111;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 6px;
            min-width: 180px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
        }
        .account-email {
            padding: 6px 8px 8px;
            color: #aaa;
            font-size: 12px;
            word-break: break-all;
        }
        .menu-btn {
            display: block;
            width: 100%;
            padding: 10px 8px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #fff;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
        }
        .menu-btn:hover {
            background: #1f2937;
        }
        .login-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 20;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, .75);
        }
        .login-form {
            width: 100%;
            max-width: 360px;
            box-sizing: border-box;
            padding: 20px;
            border: 1px solid #333;
            border-radius: 12px;
            background: #111;
        }
        .login-title {
            margin: 0 0 6px;
            font-size: 18px;
        }
        .login-hint {
            margin: 0 0 16px;
            color: #aaa;
            font-size: 13px;
        }
        .login-label {
            display: block;
            margin-bottom: 12px;
            color: #ccc;
            font-size: 13px;
        }
        .login-input {
            width: 100%;
            box-sizing: border-box;
            margin-top: 6px;
            padding: 10px 12px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #0b0f14;
            color: #fff;
            font-size: 16px;
        }
        .login-error {
            min-height: 18px;
            margin-bottom: 12px;
            color: #f87171;
            font-size: 13px;
        }
        .login-btn {
            width: 100%;
            padding: 11px 12px;
            border: 0;
            border-radius: 8px;
            background: #fff;
            color: #000;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .login-btn.secondary {
            margin-top: 8px;
            border: 1px solid #333;
            background: transparent;
            color: #ccc;
            font-weight: 400;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 30;
            max-width: calc(100vw - 32px);
            padding: 10px 16px;
            border: 1px solid #333;
            border-radius: 999px;
            background: rgba(17, 17, 17, .95);
            color: #fff;
            font-size: 13px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%);
            transition: opacity .2s;
        }
        .done-wrapper {
            display: flex;
            align-items: center;
        }
        .done-btn {
            height: 100%;
            padding: 0 14px;
            border: 0;
            border-radius: 999px;
            background: #fff;
            color: #000;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            cursor: pointer;
        }
        .done-btn:disabled {
            opacity: .5;
            cursor: default;
        }
        .modal-action {
            display: flex;
            align-items: center;
        }
        .modal-action-btn {
            height: 100%;
            padding: 0 16px;
            border: 1px solid #444;
            border-radius: 999px;
            background: #111;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
        }
        .modal-action-btn.primary {
            border-color: #fff;
            background: #fff;
            color: #000;
        }
        .camera-closed {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 10;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #000;
        }
        .camera-closed-card {
            width: min(360px, 100%);
            padding: 24px;
            border: 1px solid #333;
            border-radius: 16px;
            background: #111;
            text-align: center;
        }
        .camera-closed-title {
            font-size: 20px;
            font-weight: 700;
        }
        .camera-closed-hint {
            margin-top: 8px;
            color: #aaa;
            font-size: 13px;
            line-height: 1.5;
        }
        .camera-closed-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .camera-closed-btn {
            flex: 1;
            padding: 11px 12px;
            border: 1px solid #333;
            border-radius: 9px;
            background: transparent;
            color: #ccc;
            font-size: 14px;
            cursor: pointer;
        }
        .camera-closed-btn.primary {
            border-color: #fff;
            background: #fff;
            color: #000;
            font-weight: 700;
        }
        .review-modal {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 15;
            flex-direction: column;
            background: #0b0f14;
            color: #fff;
        }
        .review-head {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            padding: calc(16px + env(safe-area-inset-top)) 16px 16px;
            border-bottom: 1px solid #263241;
        }
        .review-title {
            font-size: 18px;
            font-weight: 700;
        }
        .review-hint {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 12px;
            line-height: 1.4;
        }
        .review-close {
            padding: 7px 10px;
            border: 1px solid #263241;
            border-radius: 8px;
            background: transparent;
            color: #ccc;
            font-size: 12px;
            cursor: pointer;
        }
        .review-status {
            min-height: 18px;
            padding: 8px 16px 0;
            color: #93c5fd;
            font-size: 13px;
        }
        .review-list {
            flex: 1;
            overflow: auto;
            display: grid;
            gap: 12px;
            padding: 16px;
        }
        .review-empty {
            padding: 32px 12px;
            color: #94a3b8;
            font-size: 14px;
            text-align: center;
        }
        .review-page {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 10px;
            border: 1px solid #263241;
            border-radius: 12px;
            background: #111820;
        }
        .review-thumb {
            flex: 0 0 auto;
            width: 84px;
            height: 112px;
            padding: 0;
            border: 0;
            border-radius: 8px;
            overflow: hidden;
            background: #0b0f14;
            cursor: pointer;
        }
        .review-thumb canvas,
        .review-thumb img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .review-page-main {
            flex: 1;
            min-width: 0;
        }
        .review-page-title {
            font-size: 14px;
            font-weight: 600;
        }
        .review-page-meta {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 12px;
        }
        .review-page-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }
        .review-btn {
            padding: 7px 10px;
            border: 1px solid #263241;
            border-radius: 8px;
            background: #0f151c;
            color: #e5e7eb;
            font-size: 12px;
            cursor: pointer;
        }
        .review-btn:disabled {
            opacity: .5;
            cursor: default;
        }
        .review-btn.danger {
            color: #f87171;
        }
        .review-actions {
            display: flex;
            gap: 10px;
            padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid #263241;
            background: #0b0f14;
        }
        .review-actions .review-btn {
            flex: 1;
            padding: 12px;
            font-size: 15px;
            font-weight: 700;
        }
        .review-actions .primary {
            border-color: #fff;
            background: #fff;
            color: #000;
        }
    </style>
</head>
<body>
    <div id="root" style="display: flex; flex-direction: column; justify-content: space-between; align-items: center;">
        <div id="top-wrapper" style="display: flex; flex-direction: row; justify-content: space-between; align-items: flex-start; width: 100vw;">
            <div id="camera-close-wrapper" style="position: relative; height: 3vh; width: 3vh;">
                <button id="camera-close" title="关闭相机" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%; opacity: 0; z-index: 2; cursor: pointer;"></button>
                <img style="position: absolute; top: 0; left: 0; cursor: pointer; height: 100%; z-index: 1" src="close.svg"></img>
            </div>
            <div id="camera-select-wrapper" style="position: relative; height: 3vh; width: 3vh;">
                <select id="camera-select" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%; opacity: 0; z-index: 2; cursor: pointer;"></select>
                <img style="position: absolute; top: 0; left: 0; cursor: pointer; height: 100%; z-index: 1" src="camera-switch.svg"></img>
            </div>
            <div id="quality-wrapper" style="position: relative; height: 3vh; width: 3vh; display: none;">
                <button id="quality" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%; opacity: 0; z-index: 2; cursor: pointer;"></button>
                <img id="quality-img" style="position: absolute; top: 0; left: 0; cursor: pointer; height: 100%; z-index: 1" src="hd.svg"></img>
            </div>
            <div id="account-wrapper" style="position: relative; height: 3vh; width: 3vh;">
                <button id="account" title="登录" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%; opacity: 0; z-index: 2; cursor: pointer;"></button>
                <img id="account-img" style="position: absolute; top: 0; left: 0; cursor: pointer; height: 100%; z-index: 1; opacity: .55;" src="settings.svg"></img>
            </div>
            <div id="flash-wrapper" style="position: relative; height: 3vh; width: 3vh; display: none;">
                <button id="flash" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%; opacity: 0; z-index: 2; cursor: pointer;"></button>
                <img id="flash-img" style="position: absolute; top: 0; left: 0; cursor: pointer; height: 100%; z-index: 1" src="flash-off.svg"></img>
            </div>
            <div id="past-wrapper" style="position: relative; height: 3vh; width: 3vh; overflow: hidden; box-sizing: border-box; border: 0.2vh solid white; border-radius: 0.2vh; display: flex; justify-content: center; align-items: center;">
                <button id="past" style="position: absolute; top: 0; left: 0; height: 100%; width: 100%; opacity: 0; z-index: 2; cursor: pointer;"></button>
            </div>
        </div>
        <div id="preview-crop" style="display: flex; justify-content: center; align-items: center; overflow: hidden;">
            <div id="preview-doc" style="position: relative">
                <video id="preview" autoplay playsinline></video>
            </div>
        </div>
        <div id="bottom-wrapper" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 100vw;">
            <div id="upload-wrapper" style="position: relative; height: 3.5vh; width: 3.5vh;">
                <input id="upload" type="file" accept="image/*" multiple style="position: absolute; top: 0; left: 0; height: 100%; width: 100%; opacity: 0; z-index: 2; cursor: pointer;"></input>
                <img style="position: absolute; top: 0; left: 0; cursor: pointer; height: 100%; z-index: 1" src="upload.svg"></img>
            </div>
            <img id="shutter" style="cursor: pointer; height: 5vh;" src="camera.svg"></img>
            <div id="done-wrapper" class="done-wrapper">
                <button id="done" class="done-btn" type="button" disabled>生成 PDF · 0 页</button>
            </div>
        </div>
    </div>
    <div id="modal" style="display: none; flex-direction: column; justify-content: space-between; align-items: center; position: absolute; top: 0; left: 0; z-index: 3; background: black;">
        <div></div>
        <div id="captures" style="display: flex; flex-direction: row; align-items: center; overflow: scroll; scrollbar-width: none; scroll-snap-type: both mandatory;"></div>
        <div id="modal-bottom-wrapper" style="display: flex; flex-direction: row; justify-content: space-between; align-items: center; width: 100vw;">
            <div id="modal-cancel-wrapper" class="modal-action">
                <button id="modal-cancel" class="modal-action-btn" type="button">重拍</button>
            </div>
            <div id="modal-done-wrapper" class="modal-action">
                <button id="modal-done" class="modal-action-btn primary" type="button">使用这张</button>
            </div>
        </div>
    </div>
    <div id="account-menu" class="account-menu">
        <div id="account-email" class="account-email"></div>
        <button id="open-library" class="menu-btn">资料库</button>
        <button id="logout" class="menu-btn">退出登录</button>
    </div>
    <div id="login-modal" class="login-modal">
        <form id="login-form" class="login-form">
            <h2 class="login-title">登录</h2>
            <p class="login-hint">登录后可自动上传到资料库</p>
            <label class="login-label">邮箱
                <input id="login-email" class="login-input" type="email" autocomplete="username" required>
            </label>
            <label class="login-label">密码
                <input id="login-password" class="login-input" type="password" autocomplete="current-password" required>
            </label>
            <div id="login-error" class="login-error"></div>
            <button type="submit" class="login-btn">登录</button>
            <button type="button" id="login-cancel" class="login-btn secondary">取消</button>
        </form>
    </div>
    <div id="camera-closed" class="camera-closed">
        <div class="camera-closed-card">
            <div class="camera-closed-title">相机已关闭</div>
            <div class="camera-closed-hint">相机指示灯已熄灭，可随时继续扫描。</div>
            <div class="camera-closed-actions">
                <button id="camera-resume" class="camera-closed-btn primary" type="button">继续扫描</button>
                <button id="camera-library" class="camera-closed-btn" type="button">打开资料库</button>
            </div>
        </div>
    </div>
    <div id="review-modal" class="review-modal">
        <div class="review-head">
            <div>
                <div class="review-title">已拍摄 <span id="review-count">0</span> 页</div>
                <div class="review-hint">点击缩略图可重新调四角，或调整顺序/删除</div>
            </div>
            <button id="review-close" class="review-close" type="button">关闭</button>
        </div>
        <div id="review-status" class="review-status"></div>
        <div id="review-list" class="review-list"></div>
        <div class="review-actions">
            <button id="review-continue" class="review-btn" type="button">继续拍摄</button>
            <button id="review-generate" class="review-btn primary" type="button">生成 PDF</button>
        </div>
    </div>
    <div id="toast" class="toast"></div>
    <script type="module" src="index.ts"></script>
</body>
</html>
