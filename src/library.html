<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0f14">
    <title>我的扫描 · 资料库</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #0b0f14;
            --panel: #111820;
            --panel-2: #0f151c;
            --border: #263241;
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #f8fafc;
            --danger: #f87171;
        }
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            min-height: 100%;
            background:
                radial-gradient(circle at top left, rgba(56, 189, 248, .12), transparent 34rem),
                var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button, input {
            font: inherit;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 14px clamp(16px, 4vw, 40px);
            border-bottom: 1px solid rgba(38, 50, 65, .7);
            background: rgba(11, 15, 20, .82);
            backdrop-filter: blur(14px);
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }
        .brand-mark {
            display: grid;
            place-items: center;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: linear-gradient(145deg, #ef4444, #991b1b);
            color: #fff;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: .04em;
            box-shadow: 0 8px 24px rgba(239, 68, 68, .25);
        }
        .brand-title {
            font-size: 16px;
            font-weight: 700;
        }
        .brand-sub {
            margin-top: 2px;
            color: var(--muted);
            font-size: 12px;
        }
        .actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--panel);
            color: var(--text);
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            transition: background .15s, border-color .15s, opacity .15s;
        }
        .btn:hover {
            background: #18222d;
            border-color: #3b4b5f;
        }
        .btn:disabled {
            cursor: wait;
            opacity: .6;
        }
        .btn.danger {
            color: var(--danger);
        }
        .btn.small {
            padding: 6px 10px;
            font-size: 12px;
        }
        .container {
            width: min(920px, 100%);
            margin: 0 auto;
            padding: clamp(20px, 5vw, 48px) clamp(16px, 4vw, 40px) 64px;
        }
        .card {
            width: min(420px, 100%);
            margin: 8vh auto 0;
            padding: 24px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: linear-gradient(180deg, rgba(17, 24, 32, .98), rgba(15, 21, 28, .98));
            box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
        }
        .card h1, .section-head h1 {
            margin: 0;
            font-size: 24px;
            letter-spacing: -.02em;
        }
        .muted {
            color: var(--muted);
        }
        .card .muted {
            margin: 8px 0 20px;
            font-size: 14px;
        }
        .form label {
            display: block;
            margin-bottom: 14px;
            color: #cbd5e1;
            font-size: 13px;
        }
        .form input {
            width: 100%;
            margin-top: 6px;
            padding: 11px 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            background: #0a0f15;
            color: var(--text);
            font-size: 16px;
            outline: none;
        }
        .form input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, .16);
        }
        .primary {
            width: 100%;
            padding: 11px 14px;
            border: 0;
            border-radius: 9px;
            background: var(--accent);
            color: #0b0f14;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        .primary:disabled {
            cursor: wait;
            opacity: .6;
        }
        .error {
            min-height: 18px;
            margin: 4px 0 12px;
            color: var(--danger);
            font-size: 13px;
        }
        .section-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
        }
        .section-head .muted {
            margin: 6px 0 0;
            font-size: 13px;
        }
        .list {
            display: grid;
            gap: 10px;
        }
        .item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(17, 24, 32, .72);
            transition: border-color .15s, background .15s;
        }
        .item:hover {
            border-color: #3b4b5f;
            background: rgba(24, 34, 45, .82);
        }
        .pdf-icon {
            display: grid;
            place-items: center;
            flex: 0 0 auto;
            width: 42px;
            height: 52px;
            border-radius: 6px;
            background: linear-gradient(145deg, #ef4444, #7f1d1d);
            color: #fff;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .04em;
        }
        .item-main {
            flex: 1;
            min-width: 0;
        }
        .item-name {
            overflow: hidden;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .item-meta {
            margin-top: 4px;
            color: var(--muted);
            font-size: 12px;
        }
        .item-actions {
            display: flex;
            flex: 0 0 auto;
            gap: 8px;
        }
        .empty {
            padding: 56px 16px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }
        .hidden {
            display: none !important;
        }
        .footer {
            padding: 24px 16px 8px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }
        .footer a {
            color: #93c5fd;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
        .toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            z-index: 30;
            max-width: calc(100vw - 32px);
            padding: 10px 16px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: rgba(17, 24, 32, .96);
            color: var(--text);
            font-size: 13px;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transform: translateX(-50%);
            transition: opacity .2s;
        }
        @media (max-width: 640px) {
            .topbar {
                align-items: flex-start;
            }
            .brand-sub {
                max-width: 42vw;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .item {
                align-items: flex-start;
                flex-wrap: wrap;
            }
            .item-actions {
                width: 100%;
                padding-left: 56px;
            }
            .item-actions .btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="brand-mark">PDF</div>
            <div>
                <div class="brand-title">我的扫描</div>
                <div class="brand-sub" id="usage">资料库</div>
            </div>
        </div>
        <div class="actions">
            <a class="btn" href="./?camera=1">使用相机</a>
            <button class="btn hidden" id="refresh">刷新</button>
            <button class="btn hidden" id="signout">退出登录</button>
        </div>
    </header>
    <main class="container">
        <div id="boot" class="empty">加载中…</div>
        <section id="login-view" class="card hidden">
            <h1>登录</h1>
            <p class="muted">登录后查看和管理你的扫描文件</p>
            <form id="login-form" class="form">
                <label>邮箱
                    <input id="email" type="email" autocomplete="username" required>
                </label>
                <label>密码
                    <input id="password" type="password" autocomplete="current-password" required>
                </label>
                <div id="login-error" class="error"></div>
                <button type="submit" class="primary" id="login-submit">登录</button>
            </form>
            <p id="config-error" class="error hidden"></p>
        </section>
        <section id="library-view" class="hidden">
            <div class="section-head">
                <div>
                    <h1>资料库</h1>
                    <p class="muted" id="library-meta"></p>
                </div>
            </div>
            <div id="list-error" class="error hidden"></div>
            <div id="empty" class="empty hidden">还没有扫描文件</div>
            <div id="list" class="list"></div>
        </section>
    </main>
    <footer class="footer">
        基于 <a href="https://github.com/101arrowz/scanner" target="_blank" rel="noopener noreferrer">101arrowz/scanner</a> · MIT
    </footer>
    <div id="toast" class="toast"></div>
    <script type="module" src="library.ts"></script>
</body>
</html>
